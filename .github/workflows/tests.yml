name: unit-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiment.py --seeds 64 --budget 2 --output /tmp/lens-receipt.json
      - run: python neuron_experiment.py --output /tmp/neuron-receipt.json
      - name: Reproduce learned receipt from sealed weights
        run: python verify_learned_receipt.py
      - name: Reproduce learned binary receipt and verify trained browser export
        run: python verify_spike_receipt.py
      - name: Check browser JavaScript
        run: |
          node --check site/neuron-core.js
          node --check site/neuron-data.js
          node --check site/neuron-ui.js
          node --check site/learned-core.js
          node --check site/learned-data.js
          node --check site/learned-ui.js
          node --check site/spike-core.js
          node --check site/spike-data.js
          node --check site/spike-ui.js
